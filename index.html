<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>WriskNuk Search</title>
  <style>
    :root { --text: #202124; --muted: #70757a; --border: #dfe1e5; --button: #f8f9fa; --button-hover: #f1f3f4; --accent: #ea4335; --yandex: #ffcc00; --shadow: 0 1px 6px rgba(32,33,36,0.15); --card-bg: #f8f9fa; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 24px; font-family: Arial, sans-serif; color: var(--text); background: #fff; }
    .container { width: min(100%, 600px); text-align: center; margin: auto; padding-bottom: 20px; }
    .logo { margin-bottom: 20px; font-size: clamp(36px, 8vw, 54px); font-weight: 700; letter-spacing: -1.5px; user-select: none; }
    .logo span { color: var(--accent); transition: color 0.2s; }
    .engine-switcher { display: inline-flex; background: var(--button); border: 1px solid var(--border); border-radius: 20px; padding: 2px; margin-bottom: 28px; }
    .engine-btn { background: none; border: none; padding: 6px 16px; font-size: 13px; font-weight: 600; border-radius: 18px; cursor: pointer; color: var(--muted); transition: all 0.2s; }
    .engine-btn.active { background: var(--accent); color: #fff; }
    .engine-btn.active.ya { background: var(--yandex); color: #000; }
    form { width: 100%; margin-bottom: 36px; }
    .search-box { display: flex; align-items: center; width: 100%; min-height: 48px; padding-left: 18px; padding-right: 8px; border: 1px solid var(--border); border-radius: 28px; background: #fff; box-shadow: var(--shadow); }
    .search-input { flex: 1; padding: 12px 0; border: 0; outline: 0; color: var(--text); background: transparent; font-size: 16px; }
    .submit-btn { background: none; border: none; padding: 8px; cursor: pointer; border-radius: 50%; color: var(--accent); display: flex; align-items: center; justify-content: center; transition: color 0.2s; }
    .submit-btn:hover { background: var(--button-hover); }
    .bookmarks-section { width: 100%; text-align: left; }
    .bookmarks-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding: 0 4px; }
    .bookmarks-title { font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; }
    .manage-btn { background: none; border: none; font-size: 12px; color: var(--muted); cursor: pointer; font-weight: 600; }
    .bookmarks-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; width: 100%; }
    .bookmark-card { position: relative; display: flex; flex-direction: column; align-items: center; padding: 14px 8px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; cursor: pointer; }
    .bookmark-card:hover { transform: translateY(-2px); background: var(--button-hover); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .bookmark-icon { width: 36px; height: 36px; border-radius: 8px; background: #fff; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; font-weight: bold; font-size: 14px; border: 1px solid var(--border); }
    .bookmark-label { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; text-align: center; }
    .actions-overlay { display: none; position: absolute; top: 4px; right: 4px; gap: 4px; }
    .bookmark-card.editing .actions-overlay { display: flex; }
    .action-icon-btn { background: #fff; border: 1px solid var(--border); border-radius: 4px; padding: 2px 6px; font-size: 10px; cursor: pointer; }
    .action-icon-btn.del { color: #dd3333; }
    .action-icon-btn.edit { color: #3333dd; }
    .add-btn-card { border-style: dashed; color: var(--muted); }
    .footer { width: 100%; padding-top: 16px; color: var(--muted); font-size: 11px; text-align: center; border-top: 1px solid var(--border); }
    @media (max-width: 480px) { .bookmarks-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; } }
  </style>
</head>
<body>
  <main class="container">
    <div class="logo" id="logo">WriskNuk <span id="logoSpan">Search</span></div>
    <div class="engine-switcher">
      <button type="button" class="engine-btn" id="goBtn">Google</button>
      <button type="button" class="engine-btn" id="yaBtn">Яндекс</button>
    </div>
    <form id="searchForm">
      <div class="search-box">
        <input id="searchInput" class="search-input" type="search" placeholder="Введите запрос..." autocomplete="off" autofocus required>
        <button type="submit" class="submit-btn" id="subBtn" title="Найти">
          <svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:currentColor;"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
        </button>
      </div>
    </form>
    <div class="bookmarks-section">
      <div class="bookmarks-header">
        <div class="bookmarks-title">Быстрый доступ</div>
        <button type="button" class="manage-btn" id="toggleManageBtn">Изменить</button>
      </div>
      <div class="bookmarks-grid" id="bookmarksGrid"></div>
    </div>
  </main>
  <footer class="footer" id="footerText">© WriskNuk Search. Разработано для экосистемы MiOS.</footer>
  <script>
    var f=document.getElementById('searchForm'),inp=document.getElementById('searchInput'),sp=document.getElementById('logoSpan'),ft=document.getElementById('footerText'),gBtn=document.getElementById('goBtn'),yBtn=document.getElementById('yaBtn'),grid=document.getElementById('bookmarksGrid'),mBtn=document.getElementById('toggleManageBtn'),sBtn=document.getElementById('subBtn');
    var eng=localStorage.getItem('wn_engine')||'google',ed=false;
    var def=[{name:'ВКонтакте',url:'https://vk.com',tag:'VK',color:'#0077FF'},{name:'GitHub',url:'https://github.com',tag:'GH',color:'#24292e'},{name:'4PDA',url:'https://4pda.to',tag:'4P',color:'#4CAF50'},{name:'YouTube',url:'https://youtube.com',tag:'YT',color:'#FF0000'}];
    var bms=JSON.parse(localStorage.getItem('wn_bookmarks'))||def;
    var cfg={google:{url:'https://google.com:'© WriskNuk Search. Поиск через Google.'},yandex:{url:'https://yandex.ru:'© WriskNuk Search. Поиск через Яндекс.'}};
    function setEng(k){eng=k;localStorage.setItem('wn_engine',k);if(k==='google'){gBtn.classList.add('active');gBtn.classList.remove('ya');yBtn.classList.remove('active');yBtn.classList.remove('ya');sp.style.color=cfg.google.color;sBtn.style.color=cfg.google.color;}else{gBtn.classList.remove('active');yBtn.classList.add('active');yBtn.classList.add('ya');sp.style.color='#000000';sBtn.style.color='#ffaa00';}ft.textContent=cfg[k].txt;}
    gBtn.addEventListener('click',function(){setEng('google');inp.focus();});yBtn.addEventListener('click',function(){setEng('yandex');inp.focus();});
    function render(){grid.innerHTML='';bms.forEach(function(b,idx){var c=document.createElement('div');c.className='bookmark-card'+(ed?' editing':'');c.addEventListener('click',function(){if(!ed)window.open(b.url,'_blank','noopener');});var ic=document.createElement('div');ic.className='bookmark-icon';ic.style.color=b.color;ic.textContent=b.tag;var lb=document.createElement('div');lb.className='bookmark-label';lb.textContent=b.name;var ov=document.createElement('div');ov.className='actions-overlay';var eB=document.createElement('button');eB.className='action-icon-btn edit';eB.setAttribute('data-index',idx);eB.textContent='✎';var dB=document.createElement('button');dB.className='action-icon-btn del';dB.setAttribute('data-index',idx);dB.textContent='✕';ov.appendChild(eB);ov.appendChild(dB);c.appendChild(ic);c.appendChild(lb);c.appendChild(ov);grid.appendChild(c);});var aC=document.createElement('div');aC.className='bookmark-card add-btn-card';var aI=document.createElement('div');aI.className='bookmark-icon';aI.textContent='+';var aL=document.createElement('div');aL.className='bookmark-label';aL.textContent='Добавить';aC.appendChild(aI);aC.appendChild(aL);aC.addEventListener('click',add);grid.appendChild(aC);}
    mBtn.addEventListener('click',function(){ed=!ed;mBtn.textContent=ed?'Готово':'Изменить';render();});
    grid.addEventListener('click',function(e){if(!ed)return;e.stopPropagation();var idx=e.target.getAttribute('data-index');if(idx===null)return;if(e.target.classList.contains('del')){bms.splice(idx,1);save();}else if(e.target.classList.contains('edit')){var b=bms[idx],n=prompt('Имя:',b.name),u=prompt('URL:',b.url);if(n&&u){b.name=n;b.url=u;b.tag=n.substring(0,2).toUpperCase();save();}}});
    function add(){var n=prompt('Имя закладок:'),u=prompt('URL (с https://):');if(n&&u){var clr=['#0077FF','#24292e','#4CAF50','#FF0000','#9C27B0'];bms.push({name:n,url:u,tag:n.substring(0,2).toUpperCase(),color:clr[Math.floor(Math.random()*clr.length)]});save();}}
    function save(){localStorage.setItem('wn_bookmarks',JSON.stringify(bms));render();}
    f.addEventListener('submit',function(e){e.preventDefault();var q=inp.value.trim();if(q){window.location.href=cfg[eng].url+'?'+cfg[eng].param+'='+encodeURIComponent(q);}});
    setEng(eng);render();
  </script>
</body>
</html>
