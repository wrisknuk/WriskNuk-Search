<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WriskNuk Search</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <div class="logo" id="logo">WriskNuk <span id="logoSpan">Search</span></div>
    <div class="engine-switcher">
      <button type="button" class="engine-btn active" data-engine="google">Google</button>
      <button type="button" class="engine-btn" data-engine="yandex">Яндекс</button>
    </div>
    <form id="searchForm">
      <div class="search-box">
        <input id="searchInput" class="search-input" type="search" placeholder="Введите запрос и нажмите Enter" autocomplete="off" autofocus required>
      </div>
    </form>
    <div class="bookmarks-section">
      <div class="bookmarks-header">
        <div class="bookmarks-title">Быстрый доступ</div>
        <button type="button" class="manage-btn" id="toggleManageBtn">Изменить</button>
      </div>
      <div class="bookmarks-grid" id="bookmarksGrid"></div>
    </div>
  </main>
  <footer class="footer" id="footerText">© WriskNuk Search. Поиск через Google.</footer>
  <script src="script.js"></script>
</body>
</html>
