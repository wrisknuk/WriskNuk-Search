<!DOCTYPE html>
<html lang=ru>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>WriskNuk Search</title>
<style>
  body { font: 20px monospace; max-width: 600px; margin: 0 auto; padding: 20px; background: #fff; color: #000; }
  h1 { font-size: 32px; margin: 0 0 20px; }
  h1 b { color: #c00; }
  form { display: flex; gap: 10px; }
  input[type=text] { flex-grow: 1; padding: 12px; font: 20px monospace; border: 2px solid #000; background: #fff; color: #000; }
  input[type=submit] { padding: 12px 20px; font: 20px monospace; font-weight: 700; border: 2px solid #000; background: #eee; color: #000; }
  p.note { margin-top: 20px; font-size: 14px; color: #666; }
</style>
</head>
<body>
  <h1>WriskNuk<b>Search</b></h1>
  <!-- ГЛАВНОЕ ИЗМЕНЕНИЕ: форма сама уходит на DDG Lite -->
  <form action="https://lite.duckduckgo.com/lite/" method="get">
    <input type="text" name="q" placeholder="Введи запрос..." autofocus>
    <input type="submit" value="&gt;">
  </form>
  <p class="note">
    Это максимально лёгкий поиск. При нажатии кнопки браузер сам загрузит страницу DuckDuckGo Lite.<br>
    Работает даже если в браузере нет JavaScript или он заблокирован.
  </p>
</body>
</html>
