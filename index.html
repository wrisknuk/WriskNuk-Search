<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WriskNuk Search</title>
  <style>
    :root {
      --text: #202124; --muted: #70757a; --border: #dfe1e5;
      --button-hover: #f1f3f4; --accent: #ea4335; --shadow: 0 1px 6px rgba(32,33,36,0.15);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100dvh; display: flex; flex-direction: column;
      align-items: center; padding: 40px 16px; font-family: Arial, sans-serif;
      color: var(--text); background: #fff; overflow-x: hidden;
    }
    .container { width: min(100%, 600px); margin: auto; text-align: center; }
    .logo { margin-bottom: 24px; font-size: clamp(32px, 8vw, 48px); font-weight: 700; letter-spacing: -1.5px; user-select: none; }
    .logo span { color: var(--accent); }
    form { width: 100%; }
    .search-box {
      display: flex; align-items: center; width: 100%; min-height: 48px;
      padding: 5px 10px 5px 18px; border: 1px solid var(--border); border-radius: 28px;
      box-shadow: var(--shadow); transition: 0.2s ease;
    }
    .search-box:focus-within { border-color: transparent; box-shadow: 0 1px 8px rgba(32,33,36,0.28); }
    .search-input { width: 100%; padding: 8px 0; border: 0; outline: 0; font-size: 16px; color: var(--text); background: transparent; }
    .search-arrow-btn {
      width: 38px; height: 38px; border: 0; border-radius: 50%; background: transparent;
      color: var(--accent); font-size: 20px; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: 0.2s ease; flex-shrink: 0;
    }
    .search-arrow-btn:hover { background: var(--button-hover); }
    .bookmarks-container { margin-top: 32px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; width: 100%; }
    .bookmark-card { position: relative; display: flex; flex-direction: column; align-items: center; text-decoration: none; color: var(--text); padding: 8px; border-radius: 8px; transition: 0.2s ease; }
    .bookmark-card:hover { background: var(--button-hover); }
    .bookmark-icon { width: 44px; height: 44px; border-radius: 50%; background: #f8f9fa; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: var(--muted); margin-bottom: 6px; border: 1px solid var(--border); flex-shrink: 0; }
    .bookmark-title { font-size: 11px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bookmark-delete { position: absolute; top: 0; right: 4px; width: 16px; height: 16px; background: #ff4d4d; color: #fff; border-radius: 50%; display: none; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; cursor: pointer; border: 0; z-index: 5; }
    .bookmark-card:hover .bookmark-delete { display: flex; }
    .add-bookmark-btn { cursor: pointer; }
    .add-bookmark-btn .bookmark-icon { background: #fff; border: 1px dashed var(--muted); color: var(--accent); }
    .overlay { position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
    .modal { background: #fff; padding: 24px; border-radius: 8px; box-shadow: var(--shadow); width: min(100%, 320px); }
    .modal-title { margin: 0 0 16px 0; font-size: 18px; font-weight: 700; }
    .modal-field { margin-bottom: 12px; }
    .modal-field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .modal-input { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 4px; font-size: 14px; outline: 0; }
    .modal-input:focus { border-color: var(--accent); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
    .modal-btn { padding: 8px 16px; border: 1px solid var(--border); border-radius: 4px; font-size: 14px; cursor: pointer; background: #fff; }
    .modal-btn.confirm { background: var(--accent); color: #fff; border-color: var(--accent); }
    .footer { position: fixed; right: 0; bottom: 16px; left: 0; color: var(--muted); font-size: 11px; text-align: center; }
    @media (max-width: 480px) { .bookmarks-container { grid-template-columns: repeat(3, 1fr); gap: 8px; } }
  </style>
</head>
<body>
  <main class="container">
    <div class="logo">WriskNuk <span>Search</span></div>
    <form action="https://google.com" method="get">
      <div class="search-box">
        <input class="search-input" type="search" name="q" placeholder="Введите поисковый запрос" autocomplete="off" autofocus required>
        <button class="search-arrow-btn" type="submit">➔</button>
      </div>
    </form>
    <div class="bookmarks-container" id="bookmarks-grid"></div>
  </main>

  <div class="overlay" id="bookmark-overlay">
    <div class="modal">
      <div class="modal-title">Новая закладка</div>
      <div class="modal-field"><label>Название</label><input type="text" id="bm-name" class="modal-input" autocomplete="off"></div>
      <div class="modal-field"><label>URL-адрес</label><input type="text" id="bm-url" class="modal-input" autocomplete="off"></div>
      <div class="modal-actions">
        <button type="button" class="modal-btn" id="bm-cancel">Отмена</button>
        <button type="button" class="modal-btn confirm" id="bm-save">Сохранить</button>
      </div>
    </div>
  </div>
  <footer class="footer">© WriskNuk Search. Поиск выполняется через Google.</footer>

  <script>
    (function () {
      const def = [{ name: 'GitHub', url: 'https://github.com' }, { name: 'Yandex', url: 'https://yandex.ru' }, { name: 'YouTube', url: 'https://youtube.com' }];
      const grid = document.getElementById('bookmarks-grid'), overlay = document.getElementById('bookmark-overlay');
      const inpName = document.getElementById('bm-name'), inpUrl = document.getElementById('bm-url');

      function getBms() { try { return JSON.parse(localStorage.getItem('wn_bms')) || def; } catch(e) { return def; } }
      function el(tag, cls, txt) { const textNode = document.createElement(tag); if(cls) textNode.className = cls; if(txt) textNode.textContent = txt; return textNode; }

      function render() {
        grid.innerHTML = '';
        getBms().forEach(function (b, i) {
          const card = el('a', 'bookmark-card'); card.href = b.url;
          const del = el('button', 'bookmark-delete', '×'); del.type = 'button';
          del.addEventListener('click', function(e) { e.preventDefault(); e.stopPropagation(); const list = getBms(); list.splice(i, 1); localStorage.setItem('wn_bms', JSON.stringify(list)); render(); });
          card.appendChild(el('div', 'bookmark-icon', b.name ? b.name.charAt(0).toUpperCase() : '?'));
          card.appendChild(el('div', 'bookmark-title', b.name));
          card.appendChild(del); grid.appendChild(card);
        });
        const add = el('div', 'bookmark-card add-bookmark-btn');
        add.appendChild(el('div', 'bookmark-icon', '+')); add.appendChild(el('div', 'bookmark-title', 'Добавить'));
        add.addEventListener('click', function() { inpName.value = ''; inpUrl.value = 'https://'; overlay.style.display = 'flex'; inpName.focus(); });
        grid.appendChild(add);
      }

      document.getElementById('bm-cancel').addEventListener('click', function() { overlay.style.display = 'none'; });
      document.getElementById('bm-save').addEventListener('click', function() {
        const n = inpName.value.trim(), u = inpUrl.value.trim(); if (!n || !u) return;
        const list = getBms(); list.push({ name: n, url: u.match(/^https?:\/\//i) ? u : 'https://' + u });
        localStorage.setItem('wn_bms', JSON.stringify(list)); overlay.style.display = 'none'; render();
      });
      overlay.addEventListener('click', function(e) { if(e.target === overlay) overlay.style.display = 'none'; });
      render();
    })();
  </script>
</body>
</html>
