<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WriskNuk Search</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container" id="box">
    <div class="logo">WriskNuk <span>Search</span></div>
    <div class="search-box">
      <input class="search-input" type="search" id="q" placeholder="Введите поисковый запрос" autocomplete="off" autofocus>
      <button class="search-arrow-btn" type="button" id="go-btn">➔</button>
    </div>
    <div class="loading-status" id="ld">Поиск ответов...</div>
    <div class="bookmarks-container" id="grid"></div>
  </main>
  
  <section class="results-wrapper" id="res"></section>
  
  <div class="overlay" id="ov">
    <div class="modal">
      <div class="modal-title">Новая закладка</div>
      <div class="modal-field">
        <label>Название</label>
        <input type="text" id="bn" class="modal-input" autocomplete="off">
      </div>
      <div class="modal-field">
        <label>URL-адрес</label>
        <input type="text" id="bu" class="modal-input" autocomplete="off">
      </div>
      <div class="modal-actions">
        <button type="button" class="modal-btn" id="bc">Отмена</button>
        <button type="button" class="modal-btn confirm" id="bs">Сохранить</button>
      </div>
    </div>
  </div>
  
  <footer class="footer">© WriskNuk Search. Полноценный независимый поиск.</footer>

  <script src="app.js"></script>
</body>
</html>
