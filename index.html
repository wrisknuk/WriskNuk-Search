<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WriskNuk Search</title>
  <style>
    /* Полное центрирование элементов по осям */
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: Arial, sans-serif; color: #202124; background: #fff; }
    
    /* Центральный контейнер */
    .search-container { width: 100%; max-width: 650px; padding: 0 20px; text-align: center; margin-top: -80px; }
    
    /* Крупный, солидный логотип WriskNuk */
    .logo { font-size: 48px; font-weight: bold; margin-bottom: 25px; letter-spacing: -1.5px; user-select: none; }
    .logo span { color: #ea4335; }
    
    /* Крупная поисковая область */
    .search-form { width: 100%; margin: 0 0 25px 0; }
    .search-box { display: flex; align-items: center; width: 100%; border: 1px solid #dfe1e5; background: #fff; padding: 4px; box-shadow: 0 1px 6px rgba(32,33,36,0.15); }
    .search-input { width: 100%; padding: 10px 12px; border: 0; outline: 0; font-size: 18px; color: #202124; background: transparent; }
    .search-arrow-btn { padding: 10px 20px; border: 0; border-left: 1px solid #dfe1e5; background: transparent; color: #ea4335; font-size: 18px; cursor: pointer; font-weight: bold; }
    .search-arrow-btn:hover { background: #f8f9fa; }
    
    /* Блок закладок по центру */
    .bookmarks { width: 100%; border-top: 1px solid #dfe1e5; padding-top: 15px; font-size: 14px; text-align: center; }
    .b-link { display: inline-block; margin: 5px 12px; color: #1a0dab; text-decoration: none; font-weight: bold; }
    .b-link:hover { text-decoration: underline; }
    .b-del { color: #ea4335; font-size: 12px; margin-left: 5px; cursor: pointer; font-weight: normal; }
    .btn-add { display: inline-block; margin: 5px 12px; font-size: 14px; color: #70757a; cursor: pointer; text-decoration: underline; font-weight: bold; }
    
    /* Плоское окно закладок */
    .pop { position: fixed; top: 30%; left: 50%; width: 320px; margin-left: -160px; background: #fff; border: 1px solid #dfe1e5; padding: 20px; display: none; z-index: 100; text-align: left; box-shadow: 0 1px 6px rgba(32,33,36,0.15); }
    .pop-field { margin-bottom: 12px; }
    .pop-field label { display: block; font-size: 12px; color: #70757a; margin-bottom: 4px; }
    .pop-input { width: 100%; padding: 6px; border: 1px solid #dfe1e5; font-size: 14px; }
    .pop-buttons { margin-top: 15px; text-align: right; }
    .pop-btn { padding: 5px 12px; border: 1px solid #dfe1e5; background: #fff; cursor: pointer; font-size: 13px; }
  </style>
</head>
<body>

  <div class="search-container">
    <div class="logo">WriskNuk <span>Search</span></div>
    
    <!-- Форма отправляет запрос на DuckDuckGo Lite с нативной маскировкой параметров оформления -->
    <form action="https://duckduckgo.com" method="GET" class="search-form">
      
      <!-- Скрытые параметры маскировки DDG Lite под наш дизайн -->
      <input type="hidden" name="kd" value="-1"> <!-- Отключает чужой логотип и шапку сайта на странице выдачи -->
      <input type="hidden" name="kt" value="a">   <!-- Задает шрифт Arial для всей выдачи -->
      <input type="hidden" name="kj" value="ea4335"> <!-- Перекрашивает важные элементы в наш красный акцент -->
      
      <div class="search-box">
        <input type="text" name="q" id="q" class="search-input" placeholder="Поиск..." autocomplete="off" autofocus required>
        <button type="submit" class="search-arrow-btn">➔</button>
      </div>
    </form>

    <div class="bookmarks" id="grid"></div>
  </div>

  <div class="pop" id="ov">
    <div style="font-weight:bold; margin-bottom:12px; font-size: 16px;">Новая закладка</div>
    <div class="pop-field"><label>Название</label><input type="text" id="bn" class="pop-input"></div>
    <div class="pop-field"><label>URL</label><input type="text" id="bu" class="pop-input"></div>
    <div class="pop-buttons">
      <button type="button" id="bc" class="pop-btn">Отмена</button>
      <button type="button" id="bs" class="pop-btn" style="font-weight:bold; margin-left: 5px;">ОК</button>
    </div>
  </div>

  <script>
    (function () {
      var def = [{ name: 'GitHub', url: 'https://github.com' }, { name: 'Yandex', url: 'https://yandex.ru' }];
      var grid = document.getElementById('grid'), ov = document.getElementById('ov'), bn = document.getElementById('bn'), bu = document.getElementById('bu');
      
      function getB() { try { return JSON.parse(localStorage.getItem('wn_b')) || def; } catch(e) { return def; } }
      function create(t, c, x) { var n = document.createElement(t); if(c) n.className = c; if(x) n.textContent = x; return n; }
      
      function render() {
        grid.innerHTML = '';
        var list = getB();
        for (var i = 0; i < list.length; i++) {
          var b = list[i];
          var a = create('a', 'b-link', b.name); a.href = b.url;
          
          var del = create('span', 'b-del', '[x]');
          (function(index) {
            del.addEventListener('click', function(e) {
              e.preventDefault(); e.stopPropagation();
              var l = getB(); l.splice(index, 1);
              localStorage.setItem('wn_b', JSON.stringify(l)); render();
            });
          })(i);
          a.appendChild(del); grid.appendChild(a);
        }
        var add = create('span', 'btn-add', '+ Добавить');
        add.addEventListener('click', function() { bn.value = ''; bu.value = 'https://'; ov.style.display = 'block'; bn.focus(); });
        grid.appendChild(add);
      }

      document.getElementById('bc').addEventListener('click', function() { ov.style.display = 'none'; });
      document.getElementById('bs').addEventListener('click', function() {
        var n = bn.value.trim(), u = bu.value.trim(); if (!n || !u) return;
        var l = getB(); l.push({ name: n, url: u.match(/^https?:\/\//i) ? u : 'https://' + u }); localStorage.setItem('wn_b', JSON.stringify(l)); ov.style.display = 'none'; render();
      });
      render();
    })();
  </script>
</body>
</html>
